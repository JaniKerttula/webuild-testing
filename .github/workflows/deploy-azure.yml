name: Deploy to Azure Web Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install, build, and test
        run: |
          npm ci
          npm run build -w @we-build/domain
          npm run build -w @we-build/api
          npm run test -w @we-build/domain
          npm run test -w @we-build/api
      - name: Type check
        run: npm run check -w @we-build/api
      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: |
            package.json
            package-lock.json
            tsconfig.base.json
            startup-api.js
            web-api.config
            packages/
            apps/api/
            !**/node_modules/**

  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install, build, and test
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          npm ci
          npm run build -w @we-build/domain
          npm run build -w @we-build/web
          npm run test -w @we-build/web
      - name: Type check
        run: npm run check -w @we-build/web
      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: |
            package.json
            package-lock.json
            tsconfig.base.json
            web.config
            startup.js
            packages/
            apps/web/
            !**/node_modules/**

  deploy-api:
    runs-on: ubuntu-latest
    needs: build-api
    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-app

      - name: Install dependencies
        run: npm ci

      - name: Rename web config for API
        run: mv web-api.config web.config

      - name: Configure API app settings
        uses: azure/appservice-settings@v1
        with:
          app-name: 'webuild-test-api'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_55F11699BF904CDB9CD0EBC4201865F4 }}
          app-settings-json: |
            [
              { "name": "CORS_ORIGIN", "value": "${{ secrets.CORS_ORIGIN }}", "slotSetting": false },
              { "name": "IGRANT_BASE_URL", "value": "${{ secrets.IGRANT_BASE_URL }}", "slotSetting": false },
              { "name": "IGRANT_AUTH_SCHEME", "value": "${{ secrets.IGRANT_AUTH_SCHEME }}", "slotSetting": false },
              { "name": "IGRANT_API_KEY", "value": "${{ secrets.IGRANT_API_KEY }}", "slotSetting": false },
              { "name": "IGRANT_USER_PIN", "value": "${{ secrets.IGRANT_USER_PIN }}", "slotSetting": false },
              { "name": "IGRANT_PERSONAL_CREDENTIAL_DEFINITION_ID", "value": "${{ secrets.IGRANT_PERSONAL_CREDENTIAL_DEFINITION_ID }}", "slotSetting": false },
              { "name": "IGRANT_POA_CREDENTIAL_DEFINITION_ID", "value": "${{ secrets.IGRANT_POA_CREDENTIAL_DEFINITION_ID }}", "slotSetting": false },
              { "name": "IGRANT_EUCC_CREDENTIAL_DEFINITION_ID", "value": "${{ secrets.IGRANT_EUCC_CREDENTIAL_DEFINITION_ID }}", "slotSetting": false },
              { "name": "IGRANT_VAT_CREDENTIAL_DEFINITION_ID", "value": "${{ secrets.IGRANT_VAT_CREDENTIAL_DEFINITION_ID }}", "slotSetting": false }
            ]

      - name: Deploy API app
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'webuild-test-api'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_55F11699BF904CDB9CD0EBC4201865F4 }}

  deploy-web:
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app

      - name: Install dependencies
        run: npm ci

      - name: Deploy Web app
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'webuild-vendor-test'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_016C792180BC47F29202D05F7105C675 }}
