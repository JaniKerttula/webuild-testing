name: Deploy to Azure Web Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: npm install, build, and test
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present
      - name: Type check
        run: npm run check
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Service runtime and startup commands
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          API_APP: ${{ secrets.AZURE_WEBAPP_API_NAME }}
          WEB_APP: ${{ secrets.AZURE_WEBAPP_WEB_NAME }}
        run: |
          set -euo pipefail

          API_URL="https://${API_APP}.azurewebsites.net"
          WEB_URL="https://${WEB_APP}.azurewebsites.net"

          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_APP" \
            --linux-fx-version "NODE|24-lts" \
            --startup-file "npm run build && npm run start -w @we-build/api"

          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_APP" \
            --settings \
              API_PORT=8080 \
              CORS_ORIGIN="$WEB_URL" \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              ENABLE_ORYX_BUILD=true

          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEB_APP" \
            --linux-fx-version "NODE|24-lts" \
            --startup-file "npm run build -w @we-build/web && npx serve -s apps/web/dist -l \$PORT"

          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEB_APP" \
            --settings \
              WEB_PORT=8080 \
              VITE_API_BASE_URL="$API_URL" \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              ENABLE_ORYX_BUILD=true

      - name: Build deployment archive
        run: |
          set -euo pipefail
          zip -r deploy.zip . \
            -x "node_modules/*" \
            -x "apps/*/node_modules/*" \
            -x "packages/*/node_modules/*" \
            -x ".git/*"

      - name: Deploy API app
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_API_NAME }}
          package: deploy.zip

      - name: Deploy Web app
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_WEB_NAME }}
          package: deploy.zip
